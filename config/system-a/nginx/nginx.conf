# /etc/nginx/nginx.conf — System A (concurso, 204.168.203.32)
#
# The directives active on the server, surveyed on 2026-10-20 (only the
# comments of Ubuntu's stock nginx.conf were dropped). The one addition to the
# package default is the `stream {}` block at the end, which serves sensor TCP
# ingestion on :5100. See docs/setup-guide.md §3.7.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    access_log /var/log/nginx/access.log;

    gzip on;

    include /etc/nginx/conf.d/*.conf;
    # /etc/nginx/sites-enabled/default is rendered by consul-template from
    # templates/nginx.conf.ctmpl — do not edit by hand.
    include /etc/nginx/sites-enabled/*;
}

# Needs libnginx-mod-stream (load_module via modules-enabled/50-mod-stream.conf).
stream {
    # stream.d/data-receiving.conf is rendered by consul-template from
    # templates/data-receiving.ctmpl — do not edit by hand.
    include /etc/nginx/stream.d/*.conf;
}
